<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Resume Upload</title>


    <!-- ===============================
         Google Font
    =============================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        /* ===============================
           Global
        =============================== */

        * {
            box-sizing: border-box;
        }


        body {
            font-family: "Inter", sans-serif;

            margin: 0;

            background-color: #f5f7fa;

            color: #1f2937;
        }


        /* ===============================
           Back Button
        =============================== */

        .back-button {
            position: fixed;

            top: 25px;
            left: 25px;

            display: flex;
            align-items: center;
            gap: 8px;

            padding: 10px 16px;

            background-color: white;

            color: #374151;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-family: "Inter", sans-serif;

            font-size: 15px;

            font-weight: 500;

            cursor: pointer;

            transition:
                background-color 0.2s,
                border-color 0.2s,
                color 0.2s;

            z-index: 1000;
        }


        .back-button:hover {
            background-color: #f3f4f6;

            border-color: #9ca3af;

            color: #111827;
        }


        /* ===============================
           Next Button
        =============================== */

        .next-button {
            display: none;

            position: fixed;

            top: 25px;
            right: 25px;

            padding: 10px 18px;

            background-color: #007bff;

            color: white;

            text-decoration: none;

            border-radius: 8px;

            font-family: "Inter", sans-serif;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background-color 0.2s,
                transform 0.2s;

            z-index: 1000;
        }


        .next-button:hover {
            background-color: #0056b3;

            transform: translateX(2px);
        }


        /* ===============================
           Main Container
        =============================== */

        .container {
            width: 1200px;

            max-width: 90%;

            margin: 100px auto 60px;
        }


        /* ===============================
           Page Title
        =============================== */

        .page-title {
            text-align: center;

            font-size: 44px;

            font-weight: 700;

            letter-spacing: -1px;

            margin: 0 0 10px;

            color: #111827;
        }


        /* ===============================
           Subtitle
        =============================== */

        .upload-note {
            text-align: center;

            font-size: 17px;

            font-weight: 400;

            color: #6b7280;

            margin: 0 0 40px;
        }


        /* ===============================
           Two Column Layout
        =============================== */

        .content {
            display: grid;

            grid-template-columns: 1fr 1fr;

            column-gap: 40px;

            align-items: start;

            position: relative;
        }


        /* ===============================
           Vertical Divider
        =============================== */

        .content::after {
            content: "";

            position: absolute;

            top: 0;

            bottom: 0;

            left: 50%;

            width: 1px;

            background-color: #d1d5db;

            transform: translateX(-50%);
        }


        /* ===============================
           Left Column
        =============================== */

        .left-column {
            text-align: center;

            padding-right: 20px;
        }


        /* ===============================
           Right Column
        =============================== */

        .right-column {
            text-align: left;

            padding-left: 20px;
        }


        /* ===============================
           Upload Box
        =============================== */

        .upload-box {
            width: 100%;

            min-height: 260px;

            padding: 45px 25px;

            background-color: white;

            border: 3px dashed #007bff;

            border-radius: 15px;

            cursor: pointer;

            transition:
                background-color 0.2s,
                border-color 0.2s;
        }


        .upload-box:hover {
            background-color: #f8fbff;
        }


        .upload-box.drag-over {
            background-color: #e8f3ff;

            border-color: #0056b3;
        }


        /* ===============================
           Upload Icon
        =============================== */

        .upload-icon {
            font-size: 50px;

            margin-bottom: 15px;
        }


        /* ===============================
           Upload Title
        =============================== */

        .upload-title {
            font-size: 23px;

            font-weight: 600;

            color: #111827;

            margin-bottom: 10px;
        }


        /* ===============================
           Upload Subtitle
        =============================== */

        .upload-subtitle {
            font-size: 15px;

            color: #6b7280;

            margin-bottom: 20px;
        }


        /* ===============================
           File Input
        =============================== */

        #pdf-input {
            display: none;
        }


        /* ===============================
           Choose Resume Button
        =============================== */

        .upload-button {
            display: inline-block;

            padding: 12px 24px;

            background-color: #007bff;

            color: white;

            border-radius: 8px;

            font-family: "Inter", sans-serif;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background-color 0.2s,
                transform 0.2s;
        }


        .upload-button:hover {
            background-color: #0056b3;

            transform: translateY(-1px);
        }


        /* ===============================
           Selected File
        =============================== */

        #file-name {
            font-size: 15px;

            font-weight: 500;

            color: #6b7280;

            margin-top: 18px;

            margin-bottom: 25px;
        }


        /* ===============================
           Section Headings
        =============================== */

        h3 {
            font-size: 24px;

            font-weight: 600;

            color: #111827;

            margin: 0 0 15px;
        }


        /* ===============================
           PDF Preview
        =============================== */

        iframe {
            width: 100%;

            height: 500px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            background-color: white;
        }


        /* ===============================
           Extracted Text
        =============================== */

        textarea {
            width: 100%;

            height: 500px;

            padding: 18px;

            font-family: "Inter", sans-serif;

            font-size: 15px;

            line-height: 1.6;

            color: #374151;

            background-color: white;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            resize: vertical;

            outline: none;
        }


        textarea:focus {
            border-color: #007bff;

            box-shadow:
                0 0 0 3px
                rgba(0, 123, 255, 0.1);
        }


        /* ===============================
           Mobile Layout
        =============================== */

        @media (max-width: 800px) {

            .content {
                grid-template-columns: 1fr;

                gap: 30px;
            }


            /* Hide vertical divider */

            .content::after {
                display: none;
            }


            .left-column {
                padding-right: 0;
            }


            .right-column {
                padding-left: 0;
            }


            .container {
                max-width: 90%;

                margin-top: 90px;
            }


            .page-title {
                font-size: 36px;
            }


            .back-button {
                top: 15px;

                left: 15px;
            }


            .next-button {
                top: 15px;

                right: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- ===============================
         Back Button
    =============================== -->

    <button
        class="back-button"
        onclick="history.back()"
    >

        <span>←</span>

        <span>Back</span>

    </button>


    <!-- ===============================
         Next Button
         Hidden until resume is processed
    =============================== -->

    <a
        href="next.html"
        id="next-button"
        class="next-button"
    >
        Next →
    </a>


    <!-- ===============================
         Main Container
    =============================== -->

    <div class="container">


        <!-- ===============================
             Page Title
        =============================== -->

        <h2 class="page-title">
            Upload Resume
        </h2>


        <!-- ===============================
             Subtitle
        =============================== -->

        <p class="upload-note">
            Upload your resume to get started
        </p>


        <!-- ===============================
             Two Column Content
        =============================== -->

        <div class="content">


            <!-- ===============================
                 LEFT SIDE
            =============================== -->

            <div class="left-column">


                <!-- Hidden File Input -->

                <input
                    type="file"
                    id="pdf-input"
                    accept=".pdf,.docx"
                >


                <!-- ===============================
                     Drag & Drop Upload Box
                =============================== -->

                <div
                    id="upload-box"
                    class="upload-box"
                >

                    <div class="upload-icon">
                        📄
                    </div>


                    <div class="upload-title">
                        Drag & Drop your resume here
                    </div>


                    <div class="upload-subtitle">
                        or click the button below
                    </div>


                    <label
                        for="pdf-input"
                        class="upload-button"
                    >
                        Choose Resume
                    </label>


                    <div class="upload-subtitle">
                        PDF or DOCX
                    </div>

                </div>


                <!-- ===============================
                     Selected File
                =============================== -->

                <div id="file-name">
                    No file selected
                </div>


                <!-- ===============================
                     PDF Preview
                =============================== -->

                <div
                    id="preview-container"
                    style="display:none;"
                >

                    <h3>
                        PDF Preview
                    </h3>


                    <iframe
                        id="pdf-viewer"
                    ></iframe>

                </div>

            </div>


            <!-- ===============================
                 RIGHT SIDE
            =============================== -->

            <div
                class="right-column"
                id="text-container"
                style="display:none;"
            >

                <h3>
                    Extracted Resume Text
                </h3>


                <textarea
                    id="resume-text"
                    readonly
                ></textarea>

            </div>


        </div>

    </div>


    <!-- ===============================
         Mammoth DOCX Reader
    =============================== -->

    <script
        src="https://unpkg.com/mammoth/mammoth.browser.min.js">
    </script>


    <!-- ===============================
         IndexedDB
    =============================== -->

    <script src="js/database.js"></script>


    <!-- ===============================
         Main App
    =============================== -->

    <script
        type="module"
        src="js/app.js"
    ></script>


</body>

</html>
