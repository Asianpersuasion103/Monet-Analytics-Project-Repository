<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Interview Meeting</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            background:
                #111827;

            color:
                white;

            font-family:
                Arial,
                sans-serif;

        }

        header {

            height:
                70px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                0 25px;

            background:
                #1f2937;

        }

        #roomDisplay {

            font-weight:
                600;

        }

        #status {

            color:
                #d1d5db;

            font-size:
                14px;

        }

        .meeting-container {

            padding:
                25px;

        }

        .video-grid {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                20px;

        }

        .video-card {

            position:
                relative;

            background:
                #000;

            border-radius:
                12px;

            overflow:
                hidden;

            aspect-ratio:
                16 / 9;

        }

        video {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

            display:
                block;

        }

        .video-label {

            position:
                absolute;

            bottom:
                12px;

            left:
                12px;

            padding:
                6px 10px;

            background:
                rgba(0,0,0,0.65);

            border-radius:
                6px;

            font-size:
                13px;

        }

        .controls {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                10px;

            margin-top:
                20px;

        }

        button {

            padding:
                11px 16px;

            border:
                none;

            border-radius:
                7px;

            cursor:
                pointer;

            font-weight:
                600;

        }

        button:disabled {

            opacity:
                0.45;

            cursor:
                not-allowed;

        }

        #startMeetingButton {

            background:
                #2563eb;

            color:
                white;

        }

        #startRecordingButton {

            background:
                #dc2626;

            color:
                white;

        }

        #stopRecordingButton {

            background:
                #f59e0b;

            color:
                white;

        }

        #endMeetingButton {

            background:
                #374151;

            color:
                white;

        }

        #recordingPreview {

            display:
                none;

            width:
                100%;

            max-width:
                1000px;

            margin-top:
                25px;

            background:
                black;

        }

        #downloadRecording {

            display:
                none;

            margin-top:
                15px;

            color:
                white;

        }

        @media (max-width: 800px) {

            .video-grid {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>


    <header>

        <div id="roomDisplay">
            Room: -
        </div>


        <div id="status">
            Connecting...
        </div>

    </header>


    <main class="meeting-container">


        <div class="video-grid">


            <div class="video-card">

                <video
                    id="localVideo"
                    autoplay
                    muted
                    playsinline
                ></video>

                <div class="video-label">
                    You
                </div>

            </div>


            <div class="video-card">

                <video
                    id="remoteVideo"
                    autoplay
                    playsinline
                ></video>

                <div class="video-label">
                    Other Participant
                </div>

            </div>


        </div>


        <div class="controls">


            <button
                id="startMeetingButton"
            >

                Start Meeting

            </button>


            <button
                id="startRecordingButton"
                disabled
            >

                Start Recording

            </button>


            <button
                id="stopRecordingButton"
                disabled
            >

                Stop Recording

            </button>


            <button
                id="endMeetingButton"
                disabled
            >

                End Meeting

            </button>


            <button
                id="backButton"
            >

                Back

            </button>


        </div>


        <video
            id="recordingPreview"
            controls
        ></video>


        <br>


        <a
            id="downloadRecording"
            href="#"
        >

            Download Recording

        </a>


    </main>


    <script
        src="../js/meeting.js"
    ></script>


</body>

</html>
