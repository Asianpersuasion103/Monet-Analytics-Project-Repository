<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Interview Meeting</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            min-height: 100%;

        }


        body {

            font-family:
                Arial,
                sans-serif;

            background:
                #111827;

            color:
                white;

            min-height:
                100vh;

        }


        /* ==========================================
           HEADER
        ========================================== */

        .header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            padding:
                18px 25px;

            background:
                #1f2937;

            border-bottom:
                1px solid #374151;

        }


        .header h1 {

            margin: 0;

            font-size:
                22px;

        }


        #roomDisplay {

            color:
                #9ca3af;

            font-size:
                14px;

        }


        /* ==========================================
           MAIN
        ========================================== */

        .container {

            width:
                100%;

            max-width:
                1200px;

            margin:
                0 auto;

            padding:
                25px;

        }


        /* ==========================================
           VIDEOS
        ========================================== */

        .video-grid {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                20px;

        }


        .video-card {

            position:
                relative;

            background:
                #000;

            border-radius:
                12px;

            overflow:
                hidden;

            border:
                1px solid #374151;

            min-height:
                300px;

        }


        .video-card video {

            width:
                100%;

            height:
                100%;

            min-height:
                300px;

            object-fit:
                cover;

            display:
                block;

            background:
                #000;

        }


        .video-label {

            position:
                absolute;

            left:
                15px;

            bottom:
                15px;

            padding:
                7px 11px;

            background:
                rgba(0, 0, 0, 0.65);

            border-radius:
                6px;

            font-size:
                13px;

        }


        /* ==========================================
           STATUS
        ========================================== */

        #status {

            text-align:
                center;

            margin:
                22px 0;

            min-height:
                22px;

            color:
                #d1d5db;

        }


        /* ==========================================
           CONTROLS
        ========================================== */

        .controls {

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            flex-wrap:
                wrap;

            gap:
                10px;

        }


        button {

            padding:
                12px 20px;

            border:
                none;

            border-radius:
                8px;

            font-size:
                15px;

            font-weight:
                600;

            cursor:
                pointer;

        }


        button:disabled {

            opacity:
                0.45;

            cursor:
                not-allowed;

        }


        #startMeetingButton {

            background:
                #2563eb;

            color:
                white;

        }


        #startRecordingButton {

            background:
                #16a34a;

            color:
                white;

        }


        #stopRecordingButton {

            background:
                #dc2626;

            color:
                white;

        }


        #endMeetingButton {

            background:
                #7f1d1d;

            color:
                white;

        }


        #backButton {

            background:
                #374151;

            color:
                white;

        }


        /* ==========================================
           RECORDING
        ========================================== */

        .recording-section {

            margin-top:
                35px;

            padding:
                25px;

            background:
                #1f2937;

            border-radius:
                12px;

            text-align:
                center;

        }


        .recording-section h2 {

            margin-top:
                0;

        }


        #recordingPreview {

            display:
                none;

            width:
                100%;

            max-width:
                800px;

            margin:
                0 auto 20px;

            background:
                black;

            border-radius:
                10px;

        }


        #downloadRecording {

            display:
                none;

            padding:
                12px 20px;

            background:
                #2563eb;

            color:
                white;

            text-decoration:
                none;

            border-radius:
                8px;

            font-weight:
                600;

        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 750px) {

            .video-grid {

                grid-template-columns:
                    1fr;

            }


            .container {

                padding:
                    15px;

            }


            .controls {

                flex-direction:
                    column;

            }


            .controls button {

                width:
                    100%;

            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         HEADER
    ========================================== -->

    <header class="header">

        <h1>
            Interview Meeting
        </h1>

        <div id="roomDisplay">
            Room: -
        </div>

    </header>


    <!-- ==========================================
         MAIN
    ========================================== -->

    <main class="container">


        <!-- ======================================
             VIDEO GRID
        ======================================= -->

        <section class="video-grid">


            <!-- LOCAL VIDEO -->

            <div class="video-card">

                <video
                    id="localVideo"
                    autoplay
                    muted
                    playsinline
                ></video>

                <div class="video-label">
                    You
                </div>

            </div>


            <!-- REMOTE VIDEO -->

            <div class="video-card">

                <video
                    id="remoteVideo"
                    autoplay
                    playsinline
                ></video>

                <div class="video-label">
                    Other Participant
                </div>

            </div>


        </section>


        <!-- ======================================
             STATUS
        ======================================= -->

        <p id="status">
            Ready to join the meeting.
        </p>


        <!-- ======================================
             CONTROLS
        ======================================= -->

        <div class="controls">


            <button
                id="backButton"
                type="button"
            >
                ← Back
            </button>


            <button
                id="startMeetingButton"
                type="button"
            >
                Start Meeting
            </button>


            <button
                id="startRecordingButton"
                type="button"
                disabled
            >
                Start Recording
            </button>


            <button
                id="stopRecordingButton"
                type="button"
                disabled
            >
                Stop Recording
            </button>


            <button
                id="endMeetingButton"
                type="button"
                disabled
            >
                End Meeting
            </button>


        </div>


        <!-- ======================================
             RECORDING
        ======================================= -->

        <section class="recording-section">


            <h2>
                Recorded Interview
            </h2>


            <video
                id="recordingPreview"
                controls
                playsinline
            ></video>


            <a
                id="downloadRecording"
                download="interview-recording.webm"
            >
                Download Recording
            </a>


        </section>


    </main>


    <!-- ==========================================
         MEETING JAVASCRIPT
    ========================================== -->

    <script
        src="../js/meeting.js"
    ></script>


</body>

</html>
