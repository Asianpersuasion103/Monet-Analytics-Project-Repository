<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Interviewer Meeting</title>


    <!-- ==========================================
         GOOGLE FONT
    =========================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- ==========================================
         INTERVIEWER JAVASCRIPT
    =========================================== -->

    <script
        src="../js/interviewer.js"
        defer
    ></script>


    <style>

        /* ==========================================
           GLOBAL
        =========================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            min-height: 100%;

        }


        body {

            font-family:
                "Inter",
                sans-serif;

            background-color:
                #f5f7fa;

            color:
                #1f2937;

            min-height: 100vh;

            padding: 30px;

        }


        /* ==========================================
           BACK BUTTON
        =========================================== */

        .back-button {

            position: fixed;

            top: 25px;
            left: 25px;

            padding:
                10px 16px;

            background-color:
                white;

            color:
                #374151;

            border:
                1px solid #d1d5db;

            border-radius:
                8px;

            font-family:
                "Inter",
                sans-serif;

            font-size:
                15px;

            font-weight:
                500;

            cursor:
                pointer;

            transition:
                background-color 0.2s,
                border-color 0.2s;

            z-index:
                1000;

        }


        .back-button:hover {

            background-color:
                #f3f4f6;

            border-color:
                #9ca3af;

        }


        /* ==========================================
           MAIN CONTAINER
        =========================================== */

        .container {

            width:
                100%;

            max-width:
                1000px;

            margin:
                80px auto 60px;

            text-align:
                center;

        }


        /* ==========================================
           TITLE
        =========================================== */

        .page-title {

            margin:
                0 0 12px;

            font-size:
                44px;

            font-weight:
                700;

            letter-spacing:
                -1px;

            color:
                #111827;

        }


        /* ==========================================
           SUBTITLE
        =========================================== */

        .subtitle {

            margin:
                0 0 35px;

            font-size:
                17px;

            color:
                #6b7280;

        }


        /* ==========================================
           INVITE SECTION
        =========================================== */

        #inviteSection {

            width:
                100%;

            max-width:
                500px;

            margin:
                0 auto;

            padding:
                40px 30px;

            background-color:
                white;

            border:
                1px solid #d1d5db;

            border-radius:
                15px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.05);

        }


        #inviteSection h2 {

            margin:
                0 0 20px;

            font-size:
                24px;

            color:
                #111827;

        }


        /* ==========================================
           INVITE INPUT
        =========================================== */

        #inviteCode {

            width:
                100%;

            padding:
                13px 15px;

            margin-bottom:
                15px;

            border:
                1px solid #d1d5db;

            border-radius:
                8px;

            font-family:
                "Inter",
                sans-serif;

            font-size:
                16px;

            outline:
                none;

        }


        #inviteCode:focus {

            border-color:
                #007bff;

            box-shadow:
                0 0 0 3px
                rgba(0, 123, 255, 0.1);

        }


        /* ==========================================
           BUTTONS
        =========================================== */

        button {

            font-family:
                "Inter",
                sans-serif;

        }


        .primary-button {

            padding:
                12px 20px;

            background-color:
                #007bff;

            color:
                white;

            border:
                none;

            border-radius:
                8px;

            font-size:
                15px;

            font-weight:
                600;

            cursor:
                pointer;

            transition:
                background-color 0.2s,
                transform 0.2s;

        }


        .primary-button:hover {

            background-color:
                #0056b3;

            transform:
                translateY(-1px);

        }


        .primary-button:disabled {

            opacity:
                0.5;

            cursor:
                not-allowed;

            transform:
                none;

        }


        /* ==========================================
           INVITE STATUS
        =========================================== */

        #inviteStatus {

            margin:
                15px 0 0;

            font-size:
                14px;

            font-weight:
                500;

            min-height:
                20px;

        }


        /* ==========================================
           MEETING SECTION
        =========================================== */

        #meetingSection {

            width:
                100%;

        }


        /* ==========================================
           LIVE VIDEO
        =========================================== */

        #videoPreview {

            width:
                640px;

            max-width:
                100%;

            display:
                block;

            margin:
                0 auto 25px;

            background-color:
                black;

            border-radius:
                10px;

        }


        /* ==========================================
           CONTROL BUTTONS
        =========================================== */

        .controls {

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            flex-wrap:
                wrap;

            gap:
                10px;

            margin-bottom:
                20px;

        }


        .controls button {

            padding:
                12px 20px;

            background-color:
                #007bff;

            color:
                white;

            border:
                none;

            border-radius:
                8px;

            font-size:
                15px;

            font-weight:
                600;

            cursor:
                pointer;

            transition:
                background-color 0.2s,
                transform 0.2s;

        }


        .controls button:hover:not(:disabled) {

            background-color:
                #0056b3;

            transform:
                translateY(-1px);

        }


        .controls button:disabled {

            opacity:
                0.5;

            cursor:
                not-allowed;

        }


        /* ==========================================
           STATUS
        =========================================== */

        #status {

            margin:
                15px 0 40px;

            font-size:
                16px;

            font-weight:
                600;

        }


        /* ==========================================
           RECORDED VIDEO SECTION
        =========================================== */

        .recording-section {

            margin-top:
                40px;

            padding-top:
                35px;

            border-top:
                1px solid #d1d5db;

        }


        .recording-section h2 {

            margin:
                0 0 20px;

            font-size:
                26px;

            color:
                #111827;

        }


        #recordingPreview {

            width:
                640px;

            max-width:
                100%;

            display:
                none;

            margin:
                0 auto 20px;

            background-color:
                black;

            border-radius:
                10px;

        }


        /* ==========================================
           DOWNLOAD LINK
        =========================================== */

        #downloadRecording {

            display:
                none;

            padding:
                12px 20px;

            background-color:
                #111827;

            color:
                white;

            text-decoration:
                none;

            border-radius:
                8px;

            font-size:
                15px;

            font-weight:
                600;

        }


        #downloadRecording:hover {

            background-color:
                #374151;

        }


        /* ==========================================
           MOBILE
        =========================================== */

        @media (max-width: 700px) {

            body {

                padding:
                    20px;

            }


            .container {

                margin-top:
                    80px;

            }


            .page-title {

                font-size:
                    36px;

            }


            .controls {

                flex-direction:
                    column;

            }


            .controls button {

                width:
                    100%;

            }


            .back-button {

                top:
                    15px;

                left:
                    15px;

            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         BACK BUTTON
    =========================================== -->

    <button
        id="backButton"
        class="back-button"
        type="button"
    >

        ← Back

    </button>


    <!-- ==========================================
         MAIN
    =========================================== -->

    <main class="container">


        <h1 class="page-title">

            Interviewer Meeting

        </h1>


        <p class="subtitle">

            Enter your invite code to continue.

        </p>


        <!-- ======================================
             INVITE CODE
        ======================================= -->

        <section id="inviteSection">

            <h2>

                Enter your invite code

            </h2>


            <input
                type="text"
                id="inviteCode"
                placeholder="Enter invite code"
                autocomplete="off"
            >


            <br>


            <button
                id="verifyCodeButton"
                class="primary-button"
                type="button"
            >

                Continue

            </button>


            <p id="inviteStatus"></p>

        </section>


        <!-- ======================================
             MEETING
        ======================================= -->

        <section
            id="meetingSection"
            style="display: none;"
        >


            <!-- LIVE CAMERA -->

            <video
                id="videoPreview"
                autoplay
                muted
                playsinline
            ></video>


            <!-- CONTROLS -->

            <div class="controls">


                <button
                    id="startMeetingButton"
                    type="button"
                >

                    Start Meeting

                </button>


                <button
                    id="startRecordingButton"
                    type="button"
                    disabled
                >

                    Start Recording

                </button>


                <button
                    id="stopRecordingButton"
                    type="button"
                    disabled
                >

                    Stop Recording

                </button>


                <button
                    id="endMeetingButton"
                    type="button"
                    disabled
                >

                    End Meeting

                </button>


            </div>


            <!-- STATUS -->

            <p id="status">

                Meeting not started.

            </p>


            <!-- ==================================
                 RECORDED VIDEO
            =================================== -->

            <section class="recording-section">


                <h2>

                    Recorded Interview

                </h2>


                <video
                    id="recordingPreview"
                    controls
                    playsinline
                ></video>


                <br>


                <a
                    id="downloadRecording"
                    download="recording.webm"
                >

                    Download Recording

                </a>


            </section>


        </section>


    </main>


</body>

</html>
