<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Recording</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="../Styles.css"
    >


    <script
        src="../js/recorder.js"
        defer
    ></script>

</head>


<body>


    <!-- BACK -->

    <button
        class="back-button"
        onclick="history.back()"
        type="button"
    >

        <span>←</span>

        <span>Back</span>

    </button>


    <main class="container">

        <h1>
            Recording
        </h1>


        <video
            id="videoPreview"
            autoplay
            muted
            playsinline
        ></video>


        <div>

            <button
                id="startMeetingButton"
                type="button"
            >
                Start Meeting
            </button>


            <button
                id="startRecordingButton"
                type="button"
            >
                Start Recording
            </button>


            <button
                id="stopRecordingButton"
                type="button"
            >
                Stop Recording
            </button>


            <button
                id="endMeetingButton"
                type="button"
            >
                Stop Meeting
            </button>

        </div>

    </main>


</body>

</html>
